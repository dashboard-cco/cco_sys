<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>Teste do gráfico Execução por Serviço</title>
<canvas id="graficoExecucao"></canvas>
<canvas id="graficoValorServicoBarras"></canvas>
<pre id="resultado">EXECUTANDO</pre>
<script src="../utils.js"></script>
<script>
(function () {
  const esperado = ["P1","P2.1","P2.2","P3","P4","P5","P6","P7","P8","P9","P10","P11","P12"];
  const api = window.CCO_GRAFICO_EXECUCAO_SERVICO;
  const falhas = [];
  function validar(condicao, mensagem) { if (!condicao) falhas.push(mensagem); }
  function testarDados(nome, fonte, valoresEsperados) {
    window.painelExecutivoAtivo = fonte;
    const dados = api.montarDados();
    validar(JSON.stringify(dados.map(x => x.servico)) === JSON.stringify(esperado), nome + ": labels");
    validar(dados.length === 13, nome + ": quantidade");
    Object.keys(valoresEsperados || {}).forEach(servico => {
      const item = dados.find(x => x.servico === servico);
      validar(item && item.porcentagem_execucao === valoresEsperados[servico], nome + ": valor de " + servico);
    });
  }

  validar(api && JSON.stringify(api.ORDEM_SERVICOS) === JSON.stringify(esperado), "ordem oficial");
  testarDados("todos", esperado.map((servico, i) => ({ servico, porcentagem_execucao:i + 1 })), { P1:1, P12:13 });
  testarDados("subconjunto", ["P1","P2.1","P2.2","P4","P5","P6","P12"].map(servico => ({ servico, porcentagem_execucao:8 })), { P3:0, P12:8 });
  testarDados("um", [{ servico:"P7", porcentagem_execucao:20 }], { P1:0, P7:20, P12:0 });
  testarDados("nenhum", [], { P1:0, "P2.1":0, P12:0 });
  testarDados("aliases", [
    { servico:"P2,1", porcentagem_execucao:21 },
    { servico:"P2-2", porcentagem_execucao:22 }
  ], { "P2.1":21, "P2.2":22 });
  validar(api.normalizarServico("P21") === "P2.1", "alias P21");
  validar(api.normalizarServico("P22") === "P2.2", "alias P22");

  let destruidos = 0;
  const configuracoes = [];
  window.Chart = function (_, config) {
    configuracoes.push(config);
    return { destroy:function () { destruidos += 1; } };
  };
  window.painelExecutivoAtivo = [];
  window.renderGraficos();
  window.renderGraficos();
  const execucoes = configuracoes.filter(c => c.data.datasets[0].label.indexOf("Execu") >= 0);
  validar(execucoes.length === 2, "duas renderizações controladas");
  validar(destruidos >= 2, "instâncias anteriores destruídas");
  validar(execucoes.every(c => c.options.scales.x.ticks.autoSkip === false), "autoSkip false");
  validar(execucoes.every(c => c.data.labels.length === 13 && c.data.datasets[0].data.length === 13), "13 labels e valores");

  document.getElementById("resultado").textContent = falhas.length ? "FALHOU: " + falhas.join(" | ") : "PASSOU: 6 cenários";
  document.title = falhas.length ? "FALHOU" : "PASSOU";
})();
</script>
</html>
